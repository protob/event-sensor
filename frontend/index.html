<!doctype html>
<!-- en-GB so native <input type=date/time> render day/month/year, never US m/d/y -->
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to anything but 0px. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Event Sensor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Pre-paint theme guard: dark is default, .light overrides.
      try {
        if (localStorage.getItem("es-theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
